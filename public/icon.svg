<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#030b1e" />
    </linearGradient>
    <linearGradient id="goldCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Outer Film Reel / Camera Geometry -->
  <circle cx="256" cy="240" r="140" fill="#0f172a" stroke="url(#goldCyanGrad)" stroke-width="12" filter="url(#glow)" />
  
  <!-- Film Sprocket Holes -->
  <circle cx="256" cy="140" r="18" fill="#22d3ee" />
  <circle cx="256" cy="340" r="18" fill="#22d3ee" />
  <circle cx="156" cy="240" r="18" fill="#22d3ee" />
  <circle cx="356" cy="240" r="18" fill="#22d3ee" />
  <circle cx="185" cy="169" r="14" fill="#3b82f6" />
  <circle cx="327" cy="169" r="14" fill="#3b82f6" />
  <circle cx="185" cy="311" r="14" fill="#3b82f6" />
  <circle cx="327" cy="311" r="14" fill="#3b82f6" />

  <!-- Center Play / Star Icon -->
  <circle cx="256" cy="240" r="64" fill="#020617" stroke="#38bdf8" stroke-width="6" />
  <polygon points="242,212 284,240 242,268" fill="url(#goldCyanGrad)" />

  <!-- Bottom Brand Text -->
  <text x="256" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#ffffff">MNG FILM</text>
  <text x="256" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#38bdf8">BOX OFFICE SYNDICATE</text>
</svg>
